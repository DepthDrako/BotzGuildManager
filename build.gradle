buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Force Gson 2.10.1 to override Gradle 8.8's bundled 2.9.1
        // Fixes Architectury Loom's VersionsManifest final field deserialization
        classpath 'com.google.code.gson:gson:2.10.1'
    }
    configurations.all {
        resolutionStrategy {
            force 'com.google.code.gson:gson:2.10.1'
        }
    }
}

plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${loom_version}" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = mod_group_id
    version = mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.modrinth.com' }
    }
}
